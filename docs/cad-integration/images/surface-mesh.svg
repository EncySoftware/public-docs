    <circle cx="50" cy="140" r="3.2"/><circle cx="120" cy="130" r="3.2"/><circle cx="190" cy="160" r="3.2"/>
    <circle cx="20" cy="166" r="3.2"/><circle cx="90" cy="158" r="3.2"/><circle cx="160" cy="190" r="3.2"/>
