<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 72 320 148" width="320" height="148" font-family="Segoe UI, Arial, sans-serif" font-size="12">
  <!-- mesh triangles -->
  <g fill="#eef3fb" stroke="#111111" stroke-width="1.3" stroke-linejoin="round">
    <polygon points="80,118 150,110 120,130"/>
    <polygon points="80,118 120,130 50,140"/>
    <polygon points="150,110 220,136 190,160"/>
    <polygon points="150,110 190,160 120,130"/>
    <polygon points="50,140 120,130 90,158"/>
    <polygon points="50,140 90,158 20,166"/>
    <polygon points="120,130 190,160 160,190"/>
    <polygon points="120,130 160,190 90,158"/>
