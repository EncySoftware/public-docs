<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 370 200" width="370" height="200" font-family="Segoe UI, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="mx" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d62728"/></marker>
    <marker id="my" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a8c4a"/></marker>
    <marker id="mz" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f6feb"/></marker>
  </defs>

  <!-- rectangular region of the plane -->
  <polygon points="135,61 291,67 225,163 69,157" fill="#eef3fb" stroke="#111111" stroke-width="2"/>

  <!-- axes from the center (extending beyond the plane) -->
  <line x1="180" y1="112" x2="180" y2="16" stroke="#1f6feb" stroke-width="1.8" marker-end="url(#mz)"/>
  <text x="174" y="26" fill="#1f6feb" text-anchor="end">vZ</text>
  <line x1="180" y1="112" x2="239" y2="25" stroke="#2a8c4a" stroke-width="1.8" marker-end="url(#my)"/>
  <text x="243" y="23" fill="#2a8c4a">vY</text>
  <line x1="180" y1="112" x2="305" y2="117" stroke="#d62728" stroke-width="1.8" marker-end="url(#mx)"/>
  <text x="309" y="121" fill="#d62728">vX</text>
  <circle cx="180" cy="112" r="3" fill="#111111"/>
  <text x="186" y="126" fill="#888888">vT</text>

  <!-- opposite corners of the bounding rectangle -->
  <text x="28" y="174" fill="#888888">xMin; yMin</text>
  <text x="290" y="52" fill="#888888">xMax; yMax</text>
</svg>
