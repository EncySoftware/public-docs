<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 240" width="380" height="240" font-family="Segoe UI, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="mn" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#888888"/></marker>
    <marker id="mp" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b2cbf"/></marker>
  </defs>

  <!-- offset surface (shifted surface, top) -->
  <path d="M 110 127 Q 180 137 250 127 L 285 92 Q 215 84 145 92 Z" fill="#eef3fb" fill-opacity="0.6" stroke="#111111" stroke-width="2"/>
  <!-- source surface Surf (bottom) -->
  <path d="M 110 185 Q 180 195 250 185 L 285 150 Q 215 142 145 150 Z" fill="#eef3fb" stroke="#111111" stroke-width="2"/>

  <!-- normal = offset direction (single) -->
  <line x1="197" y1="167" x2="197" y2="74" stroke="#7b2cbf" stroke-width="1.8" marker-end="url(#mp)"/>
  <text x="197" y="63" fill="#7b2cbf" text-anchor="middle">N (normal)</text>

  <!-- Offset dimension (along the normal) -->
  <line x1="285" y1="150" x2="322" y2="150" stroke="#888888" stroke-width="0.8"/>
  <line x1="285" y1="92"  x2="322" y2="92"  stroke="#888888" stroke-width="0.8"/>
  <line x1="316" y1="150" x2="316" y2="92" stroke="#888888" stroke-width="1" marker-start="url(#mn)" marker-end="url(#mn)"/>
  <text x="324" y="124" fill="#888888">Offset</text>

  <!-- offset-surface label -->
  <line x1="112" y1="102" x2="155" y2="112" stroke="#888888" stroke-width="0.8"/>
  <text x="38" y="105" fill="#888888">Offset Surf</text>

  <!-- source-surface label -->
  <line x1="80" y1="210" x2="155" y2="172" stroke="#888888" stroke-width="0.8"/>
  <text x="44" y="214" fill="#888888">Surf</text>
</svg>
