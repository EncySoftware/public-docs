<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 250" width="320" height="250" font-family="Segoe UI, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="mx" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d62728"/></marker>
    <marker id="my" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a8c4a"/></marker>
    <marker id="mz" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f6feb"/></marker>
    <marker id="mn" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#888888"/></marker>
  </defs>

  <!-- truncated cone (between Hmin and Hmax) -->
  <path d="M 57 180 A 58 13 0 0 0 173 180 L 136 98 A 21 5 0 0 1 94 98 Z" fill="#eef3fb" stroke="none"/>
  <path d="M 57 180 A 58 13 0 0 0 173 180" fill="none" stroke="#111111" stroke-width="2"/>
  <path d="M 57 180 A 58 13 0 0 1 173 180" fill="none" stroke="#c9c9c9" stroke-width="1.4" stroke-dasharray="5,4"/>
  <ellipse cx="115" cy="98" rx="21" ry="5" fill="#e7eef9" stroke="#111111" stroke-width="2"/>
  <line x1="57" y1="180" x2="94" y2="98" stroke="#111111" stroke-width="2"/>
  <line x1="173" y1="180" x2="136" y2="98" stroke="#111111" stroke-width="2"/>

  <!-- missing cap (up to the apex) — dashed -->
  <line x1="94" y1="98" x2="115" y2="50" stroke="#888888" stroke-width="1.4" stroke-dasharray="5,4"/>
  <line x1="136" y1="98" x2="115" y2="50" stroke="#888888" stroke-width="1.4" stroke-dasharray="5,4"/>

  <!-- semi-angle at the apex -->
  <path d="M 115 80 A 30 30 0 0 1 127 77.5" fill="none" stroke="#888888" stroke-width="1" marker-end="url(#mn)"/>
  <text x="132" y="68" fill="#888888">SemiAngle</text>

  <!-- axes -->
  <line x1="115" y1="210" x2="115" y2="40" stroke="#1f6feb" stroke-width="1.8" marker-end="url(#mz)"/>
  <text x="122" y="54" fill="#1f6feb">vZ</text>
  <line x1="115" y1="210" x2="199" y2="210" stroke="#d62728" stroke-width="1.8" marker-end="url(#mx)"/>
  <text x="203" y="214" fill="#d62728">vX</text>
  <line x1="115" y1="210" x2="63" y2="242" stroke="#2a8c4a" stroke-width="1.8" marker-end="url(#my)"/>
  <text x="47" y="246" fill="#2a8c4a">vY</text>
  <circle cx="115" cy="210" r="3" fill="#111111"/>
  <text x="105" y="204" fill="#888888" text-anchor="end">vT</text>

  <!-- radius of the lower rim (to the left) -->
  <line x1="115" y1="180" x2="57" y2="180" stroke="#888888" stroke-width="1" marker-end="url(#mn)"/>
  <text x="60" y="201" fill="#888888" text-anchor="middle">Radius</text>

  <!-- heights Hmin / Hmax -->
  <line x1="173" y1="180" x2="238" y2="180" stroke="#888888" stroke-width="0.8"/>
  <line x1="230" y1="210" x2="262" y2="210" stroke="#888888" stroke-width="0.8"/>
  <line x1="136" y1="98" x2="262" y2="98" stroke="#888888" stroke-width="0.8"/>
  <line x1="232" y1="210" x2="232" y2="180" stroke="#888888" stroke-width="1" marker-start="url(#mn)" marker-end="url(#mn)"/>
  <text x="226" y="198" fill="#888888" text-anchor="end">Hmin</text>
  <line x1="256" y1="210" x2="256" y2="98" stroke="#888888" stroke-width="1" marker-start="url(#mn)" marker-end="url(#mn)"/>
  <text x="262" y="154" fill="#888888">Hmax</text>
</svg>
