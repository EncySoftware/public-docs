<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 250" width="360" height="250" font-family="Segoe UI, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="mx" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d62728"/></marker>
    <marker id="mz" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f6feb"/></marker>
    <marker id="mn" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#888888"/></marker>
  </defs>

  <!-- body of revolution -->
  <path d="M 147 180 Q 193 117 147 55 A 22 6 0 0 1 103 55 Q 57 117 103 180 A 22 6 0 0 0 147 180 Z" fill="#eef3fb"/>
  <!-- section (circle of revolution) -->
  <ellipse cx="125" cy="117" rx="46" ry="11" fill="none" stroke="#c9c9c9" stroke-width="1.2" stroke-dasharray="5,4"/>
  <!-- upper rim (open) -->
  <ellipse cx="125" cy="55" rx="22" ry="6" fill="#eef3fb" stroke="#111111" stroke-width="1.6"/>
  <!-- left silhouette -->
  <path d="M 103 180 Q 57 117 103 55" fill="none" stroke="#111111" stroke-width="2"/>
  <!-- lower rim: front arc solid, back arc dashed -->
  <path d="M 103 180 A 22 6 0 0 0 147 180" fill="none" stroke="#111111" stroke-width="2"/>
  <path d="M 103 180 A 22 6 0 0 1 147 180" fill="none" stroke="#c9c9c9" stroke-width="1.4" stroke-dasharray="5,4"/>

  <!-- generatrix -->
  <path d="M 147 180 Q 193 117 147 55" fill="none" stroke="#7b2cbf" stroke-width="2.8"/>
  <line x1="196" y1="117" x2="173" y2="117" stroke="#888888" stroke-width="0.8"/>
  <text x="200" y="121" fill="#7b2cbf">GeneratrixID</text>

  <!-- axes -->
  <line x1="125" y1="180" x2="125" y2="32" stroke="#1f6feb" stroke-width="1.8" marker-end="url(#mz)"/>
  <text x="132" y="46" fill="#1f6feb">vZ</text>
  <line x1="125" y1="180" x2="200" y2="180" stroke="#d62728" stroke-width="1.8" marker-end="url(#mx)"/>
  <text x="204" y="184" fill="#d62728">vX</text>
  <circle cx="125" cy="180" r="3" fill="#111111"/>
  <text x="114" y="174" fill="#888888" text-anchor="end">vT</text>
</svg>
