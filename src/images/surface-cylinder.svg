<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 250" width="320" height="250" font-family="Segoe UI, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="mx" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d62728"/></marker>
    <marker id="my" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a8c4a"/></marker>
    <marker id="mz" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f6feb"/></marker>
    <marker id="mn" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#888888"/></marker>
  </defs>

  <!-- cylinder body -->
  <rect x="66" y="98" width="104" height="74" fill="#eef3fb"/>
  <path d="M 66 172 A 52 12 0 0 0 170 172 L 170 98 A 52 12 0 0 1 66 98 Z" fill="#eef3fb" stroke="none"/>
  <ellipse cx="118" cy="98" rx="52" ry="12" fill="#eef3fb" stroke="#111111" stroke-width="2"/>
  <line x1="66" y1="98" x2="66" y2="172" stroke="#111111" stroke-width="2"/>
  <line x1="170" y1="98" x2="170" y2="172" stroke="#111111" stroke-width="2"/>
  <path d="M 66 172 A 52 12 0 0 0 170 172" fill="none" stroke="#111111" stroke-width="2"/>
  <path d="M 66 172 A 52 12 0 0 1 170 172" fill="none" stroke="#c9c9c9" stroke-width="1.4" stroke-dasharray="5,4"/>

  <!-- radius (at the top base, to the left) -->
  <line x1="118" y1="98" x2="66" y2="98" stroke="#888888" stroke-width="1" marker-end="url(#mn)"/>
  <text x="90" y="82" fill="#888888" text-anchor="middle">Radius</text>

  <!-- axes -->
  <line x1="118" y1="206" x2="118" y2="36" stroke="#1f6feb" stroke-width="1.8" marker-end="url(#mz)"/>
  <text x="125" y="50" fill="#1f6feb">vZ</text>
  <line x1="118" y1="206" x2="204" y2="206" stroke="#d62728" stroke-width="1.8" marker-end="url(#mx)"/>
  <text x="208" y="214" fill="#d62728">vX</text>
  <line x1="118" y1="206" x2="64" y2="238" stroke="#2a8c4a" stroke-width="1.8" marker-end="url(#my)"/>
  <text x="48" y="242" fill="#2a8c4a">vY</text>
  <circle cx="118" cy="206" r="3" fill="#111111"/>
  <text x="108" y="200" fill="#888888" text-anchor="end">vT</text>

  <!-- heights Hmin / Hmax -->
  <line x1="170" y1="172" x2="238" y2="172" stroke="#888888" stroke-width="0.8"/>
  <line x1="206" y1="206" x2="262" y2="206" stroke="#888888" stroke-width="0.8"/>
  <line x1="170" y1="98" x2="262" y2="98" stroke="#888888" stroke-width="0.8"/>
  <line x1="232" y1="206" x2="232" y2="172" stroke="#888888" stroke-width="1" marker-start="url(#mn)" marker-end="url(#mn)"/>
  <text x="226" y="192" fill="#888888" text-anchor="end">Hmin</text>
  <line x1="256" y1="206" x2="256" y2="98" stroke="#888888" stroke-width="1" marker-start="url(#mn)" marker-end="url(#mn)"/>
  <text x="262" y="152" fill="#888888">Hmax</text>
</svg>
