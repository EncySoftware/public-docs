<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 360" width="440" height="360" font-family="Segoe UI, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="mx" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d62728"/></marker>
    <marker id="mz" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f6feb"/></marker>
    <marker id="mn" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#888888"/></marker>
  </defs>

  <!-- guide cone (dashed) + sections at the base and apex -->
  <g stroke="#c9c9c9" stroke-width="1.4" fill="none" stroke-dasharray="5,4">
    <line x1="130" y1="270" x2="180" y2="70"/>
    <line x1="290" y1="270" x2="240" y2="70"/>
    <ellipse cx="210" cy="270" rx="80" ry="27.2"/>
    <ellipse cx="210" cy="70"  rx="30" ry="10.2"/>
  </g>

  <!-- spiral axis (vZ) — behind the curve -->
  <line x1="210" y1="270" x2="210" y2="44" stroke="#1f6feb" stroke-width="1.6" marker-end="url(#mz)"/>
  <text x="210" y="34" fill="#1f6feb" text-anchor="middle">Axis (vZ)</text>

  <!-- conical spiral (3D) -->
  <path d="M 290.0 270.0 L 288.6 272.6 L 285.3 275.0 L 280.2 277.2 L 273.4 279.0 L 265.1 280.4 L 255.6 281.3 L 245.0 281.7 L 233.7 281.5 L 221.9 280.6 L 210.0 279.1 L 198.2 277.0 L 186.8 274.3 L 176.1 270.9 L 166.4 267.1 L 157.9 262.7 L 150.7 258.0 L 145.0 252.9 L 141.0 247.6 L 138.8 242.2 L 138.3 236.7 L 139.6 231.2 L 142.6 225.9 L 147.3 220.8 L 153.4 216.0 L 160.8 211.6 L 169.3 207.6 L 178.8 204.2 L 188.9 201.2 L 199.4 198.9 L 210.0 197.1 L 220.5 195.8 L 230.6 195.1 L 240.1 194.9 L 248.7 195.2 L 256.3 195.9 L 262.6 197.0 L 267.5 198.4 L 271.0 199.9 L 273.0 201.6 L 273.3 203.3 L 272.1 205.0 L 269.4 206.6 L 265.3 207.9 L 259.9 209.0 L 253.3 209.7 L 245.8 210.1 L 237.4 210.0 L 228.5 209.4 L 219.3 208.3 L 210.0 206.8 L 200.8 204.7 L 192.0 202.2 L 183.7 199.2 L 176.2 195.8 L 169.6 192.1 L 164.2 188.0 L 159.9 183.7 L 156.9 179.2 L 155.3 174.6 L 155.0 170.0 L 156.1 165.4 L 158.5 161.0 L 162.1 156.7 L 166.9 152.7 L 172.6 148.9 L 179.1 145.6 L 186.4 142.6 L 194.0 140.0 L 202.0 137.8 L 210.0 136.0 L 217.9 134.7 L 225.5 133.8 L 232.5 133.3 L 238.9 133.1 L 244.5 133.3 L 249.1 133.7 L 252.7 134.3 L 255.2 135.0 L 256.5 135.8 L 256.7 136.7 L 255.7 137.5 L 253.6 138.1 L 250.5 138.7 L 246.4 139.0 L 241.5 139.1 L 236.0 138.8 L 229.9 138.3 L 223.4 137.3 L 216.7 136.1 L 210.0 134.4 L 203.4 132.5 L 197.1 130.1 L 191.3 127.5 L 186.0 124.6 L 181.4 121.4 L 177.6 118.0 L 174.7 114.4 L 172.8 110.8 L 171.7 107.1 L 171.7 103.3 L 172.6 99.6 L 174.3 96.1 L 177.0 92.6 L 180.3 89.3 L 184.4 86.3 L 188.9 83.5 L 193.9 80.9 L 199.2 78.7 L 204.6 76.7 L 210.0 75.1 L 215.3 73.7 L 220.3 72.6 L 224.9 71.7 L 229.1 71.1 L 232.7 70.6 L 235.6 70.3 L 237.8 70.2 L 239.3 70.1 L 240.0 70.0"
        fill="none" stroke="#111111" stroke-width="2.2"/>

  <!-- Location (base center) + RefAxis -->
  <circle cx="210" cy="270" r="4" fill="#111111"/>
  <line x1="176" y1="301" x2="207" y2="272" stroke="#888888" stroke-width="0.8"/>
  <text x="112" y="306" fill="#888888">Location</text>
  <line x1="210" y1="270" x2="318" y2="270" stroke="#d62728" stroke-width="1.6" marker-end="url(#mx)"/>
  <text x="322" y="274" fill="#d62728">RefAxis (vX)</text>

  <!-- Distance (full length along the axis, left) -->
  <line x1="130" y1="270" x2="86" y2="270" stroke="#888888" stroke-width="0.8"/>
  <line x1="180" y1="70"  x2="86" y2="70"  stroke="#888888" stroke-width="0.8"/>
  <line x1="92" y1="270" x2="92" y2="70" stroke="#888888" stroke-width="1" marker-start="url(#mn)" marker-end="url(#mn)"/>
  <text x="78" y="170" fill="#888888" text-anchor="middle" transform="rotate(-90 78 170)">Distance</text>

  <!-- Step (rise per one revolution, right) -->
  <line x1="273.3" y1="203.3" x2="338" y2="203.3" stroke="#888888" stroke-width="0.8"/>
  <line x1="256.7" y1="136.7" x2="338" y2="136.7" stroke="#888888" stroke-width="0.8"/>
  <line x1="332" y1="203.3" x2="332" y2="136.7" stroke="#888888" stroke-width="1" marker-start="url(#mn)" marker-end="url(#mn)"/>
  <text x="346" y="170" fill="#888888" text-anchor="middle" transform="rotate(-90 346 170)">Step</text>

  <!-- StartRadius (base radius, bottom) -->
  <line x1="210" y1="272" x2="210" y2="322" stroke="#888888" stroke-width="0.8"/>
  <line x1="290" y1="270" x2="290" y2="322" stroke="#888888" stroke-width="0.8"/>
  <line x1="210" y1="316" x2="290" y2="316" stroke="#888888" stroke-width="1" marker-start="url(#mn)" marker-end="url(#mn)"/>
  <text x="250" y="334" fill="#888888" text-anchor="middle">StartRadius</text>

  <!-- TermRadius (apex radius, top) -->
  <line x1="240" y1="68" x2="240" y2="54" stroke="#888888" stroke-width="0.8"/>
  <line x1="210" y1="54" x2="240" y2="54" stroke="#888888" stroke-width="1" marker-start="url(#mn)" marker-end="url(#mn)"/>
  <text x="246" y="58" fill="#888888">TermRadius</text>

</svg>
