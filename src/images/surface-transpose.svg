<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 164" width="390" height="164" font-family="Segoe UI, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="mu" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e8821e"/></marker>
    <marker id="mv" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8e5bd0"/></marker>
    <marker id="mn" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#888888"/></marker>
  </defs>

  <!-- source surface -->
  <polygon points="40,80 150,68 165,140 55,152" fill="#eef3fb" stroke="#111111" stroke-width="2"/>
  <line x1="40" y1="80" x2="128" y2="70" stroke="#e8821e" stroke-width="2.8" marker-end="url(#mu)"/>
  <text x="132" y="68" fill="#e8821e">U</text>
  <line x1="40" y1="80" x2="51" y2="138" stroke="#8e5bd0" stroke-width="2.8" marker-end="url(#mv)"/>
  <text x="34" y="146" fill="#8e5bd0" text-anchor="end">V</text>

  <!-- transposed (U and V swapped) -->
  <polygon points="225,80 335,68 350,140 240,152" fill="#eef3fb" stroke="#111111" stroke-width="2"/>
  <line x1="225" y1="80" x2="236" y2="138" stroke="#e8821e" stroke-width="2.8" marker-end="url(#mu)"/>
  <text x="221" y="146" fill="#e8821e" text-anchor="end">U</text>
  <line x1="225" y1="80" x2="313" y2="70" stroke="#8e5bd0" stroke-width="2.8" marker-end="url(#mv)"/>
  <text x="317" y="68" fill="#8e5bd0">V</text>

  <!-- transition -->
  <line x1="180" y1="106" x2="212" y2="106" stroke="#888888" stroke-width="1" marker-end="url(#mn)"/>
  <text x="196" y="98" fill="#888888" text-anchor="middle">U ↔ V</text>
</svg>
